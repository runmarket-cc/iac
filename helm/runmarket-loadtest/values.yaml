enabled: true

target:
  # 기본값: K3s 내부 서비스(svc) FQDN 주소 (applications 네임스페이스)
  apiBaseUrl: "http://runmarket.applications.svc.cluster.local:80"
  wsBaseUrl: "ws://runmarket-socket.applications.svc.cluster.local:80"
  # 인증이 필요한 API 호출 시 사용할 Bearer JWT 토큰
  authToken: ""
  # 외부 도메인 테스트 시 예시:
  # apiBaseUrl: "https://api.runmarket.cc"
  # wsBaseUrl: "wss://pulse.runmarket.cc"

loadProfile:
  vus: 50             # 동시 가상 유저 수 (Virtual Users)
  duration: "2m"      # 부하 테스트 지속 시간 (예: 30s, 2m, 5m)

k6:
  image:
    repository: grafana/k6
    tag: "latest"
    pullPolicy: IfNotPresent

secret:
  existingSecret: ""
