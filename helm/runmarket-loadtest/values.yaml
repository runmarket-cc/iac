enabled: true

target:
  # 기본값: K3s 내부 서비스(svc) 주소 (Cloudflare/Ingress 영향을 배제한 순수 백엔드 측정)
  apiBaseUrl: "http://runmarket:80"
  wsBaseUrl: "ws://runmarket-socket:8081"
  # 외부 도메인 테스트 시 예시:
  # apiBaseUrl: "https://api.runmarket.cc"
  # wsBaseUrl: "wss://pulse.runmarket.cc"

loadProfile:
  vus: 50             # 동시 가상 유저 수 (Virtual Users)
  duration: "2m"      # 부하 테스트 지속 시간 (예: 30s, 2m, 5m)

k6:
  image:
    repository: grafana/k6
    tag: "latest"
    pullPolicy: IfNotPresent

secret:
  existingSecret: ""
