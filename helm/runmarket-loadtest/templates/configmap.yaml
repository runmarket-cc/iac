apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  labels:
    app.kubernetes.io/name: {{ include "runmarket-loadtest.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  pacer_load_test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import ws from 'k6/ws';
    import { Counter, Trend } from 'k6/metrics';

    // 부하테스트 검증용 커스텀 메트릭
    const gpsMessagesSent = new Counter('gps_messages_sent');
    const runnerDistanceTrend = new Trend('runner_moved_distance_meters');
    const runnerTimeTrend = new Trend('runner_elapsed_seconds');

    const targetVus = __ENV.K6_TARGET_VUS ? parseInt(__ENV.K6_TARGET_VUS) : 3000;
    const rampUpTime = __ENV.K6_RAMP_UP || '4m50s';
    const holdTime = __ENV.K6_HOLD_TIME || '2m';

    export const options = {
      stages: [
        { duration: rampUpTime, target: targetVus },  // 10초당 100명씩 3000명까지 서서히 증대 (4분 50초)
        { duration: holdTime, target: targetVus },    // 3000명 피크 상태 유지 (2분)
        { duration: '30s', target: 0 },              // 감축 안전 종료
      ],
      thresholds: {
        http_req_duration: ['p(95)<1000'],
        checks: ['rate>0.80'],
      },
    };

    const API_BASE_URL = __ENV.API_BASE_URL || 'http://runmarket:80';
    const WS_BASE_URL = __ENV.WS_BASE_URL || 'ws://runmarket-socket:8081';

    const AUTH_BEARER_TOKEN = __ENV.AUTH_BEARER_TOKEN || '';

    export default function () {
      const runnerId = `runner-vu-${__VU}-${__ITER}`;
      const groupId = 'GROUP-TEST-01';

      // 1. 소켓 토큰 발급 (REST API)
      const tokenPayload = JSON.stringify({
        role: 'RUNNER',
        groupId: groupId,
        runnerId: runnerId,
      });

      const headers = { 'Content-Type': 'application/json' };
      if (AUTH_BEARER_TOKEN) {
        headers['Authorization'] = `Bearer ${AUTH_BEARER_TOKEN}`;
      }

      const tokenRes = http.post(`${API_BASE_URL}/api/v1/socket-token`, tokenPayload, { headers });
      
      const tokenSuccess = check(tokenRes, {
        '1. Socket Token HTTP 200': (r) => r.status === 200,
        '1. Socket Token Received': (r) => r.json() && r.json('accessToken') !== undefined,
      });

      if (!tokenSuccess) {
        sleep(1);
        return;
      }

      const socketToken = tokenRes.json('accessToken');
      const wsUrl = `${WS_BASE_URL}/ws/runner/${runnerId}?token=${socketToken}`;

      // 러너별 고유 시작 위치 (VU 번호에 따라 서울 지역 전역으로 궤적 분산)
      const baseLat = 37.5665;
      const baseLng = 126.9780;
      const spiralAngle = (__VU * 137.5) * (Math.PI / 180);
      const spiralRadius = 0.003 + ((__VU % 50) * 0.0003); // 300m ~ 3km 범위로 넓게 분산

      let currentLat = baseLat + (Math.sin(spiralAngle) * spiralRadius);
      let currentLng = baseLng + (Math.cos(spiralAngle) * spiralRadius);

      // 러너별 이동 방향 (Heading) 및 속도 (초당 약 3m 전진, 페이스 5:30/km 수준)
      const heading = ((__VU * 45) + (__ITER * 15)) * (Math.PI / 180);
      const speedMetersPerSec = 2.8 + ((__VU % 10) * 0.1); // 2.8m/s ~ 3.7m/s
      const dLat = (speedMetersPerSec / 111000) * Math.sin(heading);
      const dLng = (speedMetersPerSec / 88800) * Math.cos(heading);

      let accumulatedDistance = 0.0;
      let elapsedTime = 0;

      // 2. WebSocket 연결 및 지속적인 실시간 이동 좌표 Publish (30초 동안 지속 런)
      const wsRes = ws.connect(wsUrl, {}, function (socket) {
        socket.on('open', function () {
          for (let i = 0; i < 30; i++) {
            currentLat += dLat;
            currentLng += dLng;
            accumulatedDistance += (speedMetersPerSec / 1000.0);
            elapsedTime += 1;

            const latStr = currentLat.toFixed(6);
            const lngStr = currentLng.toFixed(6);
            const distStr = accumulatedDistance.toFixed(2);

            const gpsPayload = JSON.stringify({
              lat: parseFloat(latStr),
              lng: parseFloat(lngStr),
              pace: "5:30",
              distance: parseFloat(distStr),
              time: elapsedTime
            });

            socket.send(gpsPayload);
            gpsMessagesSent.add(1);

            // 특정 샘플 유저(50번째 VU마다)는 5초 주기로 실시간 이동 좌표 로그를 출력하여 모니터링 가능하도록 함
            if (__VU % 50 === 1 && i % 5 === 0) {
              console.log(`[VU ${__VU} / ${runnerId}] 🏃 RUNNING -> Lat: ${latStr}, Lng: ${lngStr}, Dist: ${(accumulatedDistance * 1000).toFixed(1)}m, Time: ${elapsedTime}s`);
            }

            sleep(1);
          }

          // 러너 1회 주행 완료 후 커스텀 메트릭 기록
          runnerDistanceTrend.add(accumulatedDistance * 1000.0); // m 단위
          runnerTimeTrend.add(elapsedTime); // 초 단위
          socket.close();
        });

        socket.on('error', function (e) {
          // WS error handling
        });
      });

      check(wsRes, {
        '2. WebSocket Connection 101': (r) => r && r.status === 101,
      });

      sleep(1);
    }
