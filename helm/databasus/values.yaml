# Databasus Helm Configuration for RunMarket PostgreSQL Backup & Recovery
# Chart: oci://ghcr.io/databasus/charts/databasus
# Namespace: databasus

ingress:
  enabled: true
  className: "traefik" # or nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  hosts:
    - host: databasus.runmarket.cc
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: databasus-tls
      hosts:
        - databasus.runmarket.cc

persistence:
  enabled: true
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  # storageClassName: "local-path"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# Backup & Restore Verification Policy
# - Daily automated backup for PostgreSQL database
# - Automated daily restore verification agent test
config:
  timezone: "Asia/Seoul"
